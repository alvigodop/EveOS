<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveOS Gemini Runtime Monitor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <main class="container">
        <section class="header">
            <div class="monitor-title-row">
                <div>
                    <p class="eyebrow">EveOS Operations</p>
                    <h1>Gemini Runtime Monitor</h1>
                    <p class="monitor-copy">Current loopback services only. No legacy command server is required.</p>
                </div>
                <span id="serverStatus" class="status-stopped">Checking</span>
            </div>

            <div class="server-controls" aria-label="Gemini runtime controls">
                <button id="toggleGeminiBtn" class="mdl-button mdl-button--raised mdl-button--colored">
                    <i class="material-icons">play_arrow</i> Start Gemini
                </button>
                <button id="restartGeminiBtn" class="mdl-button mdl-button--raised">
                    <i class="material-icons">refresh</i> Restart Gemini
                </button>
                <button id="refreshStatusBtn" class="mdl-button mdl-button--raised">
                    <i class="material-icons">sync</i> Refresh Status
                </button>
                <button id="openEveOSBtn" class="mdl-button mdl-button--raised">
                    <i class="material-icons">open_in_new</i> Open EveOS
                </button>
            </div>

            <div class="service-grid" aria-live="polite">
                <article class="service-card" id="serviceControl">
                    <span>Control helper</span>
                    <strong>Checking</strong>
                    <small>Port 9082</small>
                </article>
                <article class="service-card" id="serviceGemini">
                    <span>Gemini Live</span>
                    <strong>Checking</strong>
                    <small>WebSocket 9083 / status 9084</small>
                </article>
                <article class="service-card" id="serviceWeb">
                    <span>EveOS surface</span>
                    <strong>Checking</strong>
                    <small id="serviceWebAddress">Current page</small>
                </article>
            </div>

            <div id="messageLog" aria-label="Runtime messages"></div>
            <div class="controls">
                <button id="refreshFrameBtn" class="button refresh-btn">Refresh Gemini Interface</button>
            </div>
            <div id="status" class="status">Server status is being checked.</div>
            <div id="error" class="error"></div>
        </section>

        <section class="frame-container">
            <iframe id="serverFrame" src="gemini_chat_interface.html" title="Gemini Chat Interface"></iframe>
        </section>
    </main>
    <script src="server_monitor_files/monitor_loader.js"></script>
</body>
</html>
