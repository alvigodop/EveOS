<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve-OS</title>
    <link rel="stylesheet" href="css/main.css?v=0.2.3">
    <script src="js/modules/core/theme-boot.js?v=0.2.2"></script>

</head>

<body>

    <!-- SIDEBAR -->
    <div id="sidebar"></div>

    <!-- MAIN CONTENT WRAPPER -->

    <div id="main-content">

        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="logo">Eve OS</div>
            <div class="top-right">
                <button onclick="toggleBulkMode()" title="Select Multiple">✅ Select</button>
                <button onclick="toggleView()" title="View">📋 View</button>
                <button onclick="toggleScratchpad()" title="Notes">📝 Notes</button>
                <button onclick="openSettings()" title="Settings">⚙ Settings</button>
                <button onclick="openSocialManagerModal()" title="Social Manager">&#128241; Social</button>
            </div>
        </div>

        <!-- HEADER -->
        <div class="header">
            <div id="main-display" class="greeting" onclick="toggleHeaderMode()">Good Morning</div>
            <div id="date-area" style="font-size:1.1rem; opacity:0.8; margin-bottom:10px;"></div>

            <!-- MODULE INJECTION POINT -->
            <div class="info-row">
                <div id="weather-span" onclick="fetchWeather()"
                    style="display:none; cursor:pointer; align-items:center; gap:8px;">
                    <span id="weather-icon">☁️</span>
                    <span id="weather-text">Weather</span>
                </div>
                <div id="timer-area">
                    <span id="timer-display" onclick="editTimer()" style="cursor:pointer;"
                        title="Click to Edit Time">25:00</span>
                    <button class="timer-btn" id="timer-toggle-btn" onclick="toggleTimer()">▶</button>
                    <button class="timer-btn" onclick="resetTimer()">↺</button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <input type="text" id="search" name="eve-main-search" placeholder="Search or Type URL..."
                        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                        data-lpignore="true" data-1p-ignore="true" autofocus
                        onkeypress="handleOmniboxKey(event)">
                    <button class="search-icon-btn" onclick="performWebSearch()">🔍</button>
                    <button class="search-advanced-btn" onclick="openExpandedSearchFromMain(false)" title="Expanded Search">⚙</button>
                </div>
            </div>

            <div class="action-row">
                <button class="big-btn btn-add" onclick="openAddModal()">+ Add Link</button>
                <button class="big-btn btn-sec" onclick="sweepDone()">🧹 Sweep</button>
                <button class="big-btn btn-sec" onclick="openBulkModal()">📚 Bulk</button>
            </div>
        </div>

        <div id="focus-banner" class="focus-banner" onclick="clearFocus()"></div>

        <div id="dock-container" class="dock-container hidden"></div>

        <div class="container" id="dashboard-grid"></div>
    </div>

    <!-- MODALS & EMOJI PICKER LOADED DYNAMICALLY -->
    <!-- SCRATCHPAD LOADED DYNAMICALLY -->
    <!-- CONTEXT MENUS LOADED DYNAMICALLY -->


    <!-- Wiki Popup Overlay (Scraper Feature) -->
    <div class="popup-overlay" id="wikiPopup">
        <div class="popup-content">
            <div class="popup-header">
                <div class="popup-nav">
                    <button class="popup-nav-btn" id="popupBackBtn" onclick="PopupManager.navigatePopupBack()"
                        title="Go back" disabled>←</button>
                    <button class="popup-nav-btn" id="popupForwardBtn" onclick="PopupManager.navigatePopupForward()"
                        title="Go forward" disabled>→</button>
                </div>
                <h3 class="popup-title" id="wikiPopupTitle">Wiki Preview</h3>
                <button class="popup-close" onclick="PopupManager.closePopup()">×</button>
            </div>
            <div class="popup-iframe-container">
                <iframe id="wikiPopupFrame" class="popup-iframe"
                    sandbox="allow-forms allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
        </div>
    </div>

    <!-- Enhanced Loading Indicator (Search Monitor) -->
    <div id="loadingIndicator" class="loading-indicator compact visible">
        <div class="dot"></div>
        <div class="indicator-content">
            <div class="indicator-title">Search Monitor</div>
            <div id="gemini-placeholder"></div>
            <div class="status-group">
                <div class="status-text">Idle</div>
                <div class="wave-container">
                    <div class="wave"></div>
                </div>
            </div>
            <div class="expanded-content">
                <div class="stats-row">
                    <span class="stats-label">Status:</span>
                    <span class="stats-value" id="searchStatus">Idle</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">Wikis Searched:</span>
                    <span class="stats-value" id="wikisSearched">0/0</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">Results Found:</span>
                    <span class="stats-value" id="resultsFound">0</span>
                </div>
            </div>
        </div>
    </div>


    <!-- SCRIPTS -->
    <script src="js/config/manifest/scripts.js"></script>
    <script src="js/config/manifest/styles.js"></script>
    <script src="js/config/manifest.js"></script>
    <script src="js/style-loader.js"></script>
    <script src="js/script-loader.js"></script>

</body>

</html>
