<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">EveOS Piano Automation interface overview</title>
  <desc id="desc">A diagram of the integrated Piano Auto Player showing the Sheet Player, playback controls, Player Cache, From Sheet Finder staging, and bulk conversion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0c1218"/>
      <stop offset="1" stop-color="#171217"/>
    </linearGradient>
    <style>
      .panel{fill:#151a20;stroke:#31404d;stroke-width:1.5}.field{fill:#0b0f13;stroke:#34414d;stroke-width:1.2}.chip{fill:#202830;stroke:#3b4855}.blue{fill:#168fe5}.red{fill:#51242a}.label{fill:#55b8ff;font:700 13px system-ui,sans-serif;letter-spacing:1.4px}.h1{fill:#f5f7fa;font:800 38px system-ui,sans-serif}.h2{fill:#f5f7fa;font:750 20px system-ui,sans-serif}.body{fill:#aeb8c2;font:14px system-ui,sans-serif}.small{fill:#8996a3;font:12px system-ui,sans-serif}.button{fill:#eef4f8;font:700 12px system-ui,sans-serif;text-anchor:middle}.darkButton{fill:#0f151a;stroke:#34414d;stroke-width:1.2}.line{stroke:#34414d;stroke-width:1}.accent{fill:#50b5ff}.muted{fill:#607080}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="54" y="52" class="label">LOCALHOST STUDIO · AUDIOFLIX INTEGRATED TOOL</text>
  <text x="54" y="96" class="h1">Piano Automation</text>
  <text x="54" y="123" class="body">Search sheets, stage conversions, audition internally, or send timed keys to a selected piano window.</text>
  <circle cx="1120" cy="65" r="6" fill="#8a9aa9"/><rect x="1135" y="51" width="36" height="24" rx="12" class="darkButton"/><text x="1153" y="67" class="small" text-anchor="middle">Ready</text>

  <rect x="54" y="150" width="738" height="315" rx="18" class="panel"/>
  <text x="76" y="180" class="label">SHEET PLAYER</text>
  <rect x="76" y="194" width="505" height="46" rx="11" class="field"/>
  <text x="91" y="224" class="h2">Untitled sheet</text>
  <rect x="642" y="194" width="120" height="46" rx="11" class="darkButton"/><text x="702" y="223" class="button">Save song</text>
  <line x1="76" y1="254" x2="762" y2="254" class="line"/>
  <g>
    <rect x="76" y="270" width="48" height="31" rx="8" class="chip"/><text x="100" y="290" class="button">←</text>
    <rect x="132" y="270" width="55" height="31" rx="8" class="chip"/><text x="159" y="290" class="button">-10</text>
    <rect x="195" y="270" width="55" height="31" rx="8" class="chip"/><text x="222" y="290" class="button">-1</text>
    <rect x="258" y="270" width="155" height="31" rx="8" class="field"/><text x="275" y="290" class="small">Event</text><text x="381" y="290" class="button">1 / 0</text>
    <rect x="421" y="270" width="45" height="31" rx="8" class="blue"/><text x="443" y="290" class="button">Go</text>
    <rect x="474" y="270" width="48" height="31" rx="8" class="chip"/><text x="498" y="290" class="button">+1</text>
    <rect x="530" y="270" width="55" height="31" rx="8" class="chip"/><text x="557" y="290" class="button">+10</text>
  </g>
  <rect x="76" y="315" width="686" height="88" rx="10" class="field"/>
  <text x="92" y="342" class="small">Paste a piano sheet here…</text>
  <text x="92" y="365" class="small">Example: t r w [4o] p s g f d -- [1o] u i o</text>
  <g>
    <rect x="76" y="418" width="75" height="34" rx="9" class="blue"/><text x="113" y="440" class="button">▶ Play</text>
    <rect x="160" y="418" width="78" height="34" rx="9" class="darkButton"/><text x="199" y="440" class="button">Ⅱ Pause</text>
    <rect x="247" y="418" width="72" height="34" rx="9" class="red"/><text x="283" y="440" class="button">■ Stop</text>
    <text x="342" y="440" class="small">□ Dry run</text><text x="438" y="440" class="small">□ Internal play</text>
  </g>

  <rect x="810" y="150" width="336" height="315" rx="18" class="panel"/>
  <text x="832" y="180" class="label">PLAYBACK</text><text x="832" y="207" class="h2">Controls</text>
  <text x="832" y="241" class="small">Target window</text><rect x="832" y="250" width="292" height="36" rx="9" class="field"/><text x="847" y="273" class="body">Select / refresh</text>
  <text x="832" y="313" class="small">Input route</text><rect x="832" y="322" width="292" height="36" rx="9" class="field"/><text x="847" y="345" class="body">Foreground — reliable</text>
  <text x="832" y="385" class="small">Piano layout</text><rect x="832" y="394" width="292" height="36" rx="9" class="field"/><text x="847" y="417" class="body">61-key — C2–C7</text>
  <text x="832" y="450" class="small">Timing · hold · gate · speed</text>

  <rect x="54" y="485" width="356" height="180" rx="18" class="panel"/>
  <text x="76" y="515" class="label">PLAYER CACHE</text><text x="76" y="540" class="h2">Temporary navigation</text>
  <text x="76" y="566" class="body">← Back · last 10 loaded · Forward →</text>
  <rect x="76" y="584" width="312" height="38" rx="9" class="field"/><text x="92" y="608" class="small">Recent sheets and performances</text>
  <text x="76" y="645" class="small">Cached only — permanent saving stays explicit.</text>

  <rect x="422" y="485" width="356" height="180" rx="18" class="panel"/>
  <text x="444" y="515" class="label">FROM SHEET FINDER</text><text x="444" y="540" class="h2">Staging inbox</text>
  <text x="444" y="566" class="body">Search results and finished AI conversions wait here.</text>
  <rect x="444" y="584" width="312" height="38" rx="9" class="field"/><text x="460" y="608" class="small">Load into Player · Discard</text>
  <text x="444" y="645" class="small">Loading removes the staged item and enters history.</text>

  <rect x="790" y="485" width="356" height="180" rx="18" class="panel"/>
  <text x="812" y="515" class="label">BULK CONVERSION</text><text x="812" y="540" class="h2">Queue media → piano</text>
  <text x="812" y="566" class="body">Paste many URLs or queue a .txt list.</text>
  <rect x="812" y="584" width="198" height="38" rx="9" class="blue"/><text x="911" y="608" class="button">Queue conversions</text>
  <rect x="1018" y="584" width="106" height="38" rx="9" class="darkButton"/><text x="1071" y="608" class="button">Queue .txt</text>
  <text x="812" y="645" class="small">Heavy transcription jobs run sequentially.</text>
</svg>
